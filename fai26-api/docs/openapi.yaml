              schema: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '500': { $ref: '#/components/responses/SalahServer' }
  /api/ipd/{id}/setujui:
    post:
      tags: [IPD]
      summary: Setujui satu inspeksi
      description: |
        Permission `ipd.setujui`. MENUNGGU menjadi DISETUJUI (terkunci). Galat: 403 ditujukan ke asisten lain, 404, 409 sudah diproses, 422 id bukan UUID.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Disetujui.
