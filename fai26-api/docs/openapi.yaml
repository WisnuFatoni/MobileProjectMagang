            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { description: Tidak ditemukan., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Bentrok (sudah diproses, atau nomor ganda)., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/TidakValid' }
        '500': { $ref: '#/components/responses/SalahServer' }
  /api/ipd/{id}/tolak:
    post:
      tags: [IPD]
      summary: Tolak satu inspeksi dengan alasan
      description: |
        Permission `ipd.setujui`. MENUNGGU menjadi DITOLAK; alasan (wajib, maksimal 300 karakter, body `{"alasan": "..."}`) tampil di HP inspektur yang dapat memperbaiki dan mengirim ulang.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
