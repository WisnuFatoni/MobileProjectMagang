        '500': { $ref: '#/components/responses/SalahServer' }
  /api/admin/ipd:
    get:
      tags: [IPD]
      summary: Daftar inspeksi (web)
      description: |
        Permission `ipd.lihat`. Terbaru dulu, dengan ringkasan loses dan foto tiap baris. Penyaring: dari, sampai, status, divisi_kode, blok_kode, pemanen_hrmb_code; halaman dan per_halaman (bawaan 25, maksimal 100).
      security: [{ bearerAuth: [] }]
      parameters:
