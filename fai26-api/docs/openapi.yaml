      summary: Laporan loses
      description: |
        Permission `laporan.ipd`. Dihitung dari inspeksi DISETUJUI saja; `dari` dan `sampai` kosong berarti 30 hari terakhir (WIB). persen_pokok_bertemuan = pokok bertemuan dibagi pokok diperiksa; persen_pokok per kode = pokok yang memuat kode itu dibagi pokok diperiksa (1 desimal). Berisi ringkasan, per_kelompok (BUAH, BRONDOLAN, PELEPAH), per_pemanen, per_blok, per_divisi, dan per_tanggal.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dari, in: query, required: false, description: "YYYY-MM-DD", schema: { type: string } }
        - { name: sampai, in: query, required: false, description: "YYYY-MM-DD", schema: { type: string } }
        - { name: divisi_kode, in: query, required: false, description: "Kode divisi", schema: { type: string } }
        - { name: blok_kode, in: query, required: false, description: "Kode blok", schema: { type: string } }
        - { name: pemanen_hrmb_code, in: query, required: false, description: "HRMBCODE pemanen", schema: { type: integer } }
      responses:
        '200':
          description: Laporan loses.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '422': { $ref: '#/components/responses/TidakValid' }
        '500': { $ref: '#/components/responses/SalahServer' }
