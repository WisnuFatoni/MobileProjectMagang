        Permission `laporan.lihat`. Query `tanggal` (opsional, `YYYY-MM-DD`; bawaan hari ini menurut WIB). Mengelompokkan catatan satu hari per pemanen (kode ERP `HRMBCODE`): jumlah catatan, janjang, janjang matang beserta persentasenya, brondolan (kg), dan jumlah catatan yang masih menunggu persetujuan krani. Urut janjang terbanyak; janjang yang sama berarti peringkat yang sama. Catatan berstatus ditolak tidak dihitung. Hanya membaca: premi (rupiah) tidak dihitung karena tarif dan basis premi dimiliki ERP. Galat: 422 tanggal salah format.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: tanggal
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProduktivitasHarian' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '422': { $ref: '#/components/responses/TidakValid' }
        '500': { $ref: '#/components/responses/SalahServer' }
  /api/admin/panen:
    get:
      tags: [Admin]
      summary: Daftar catatan panen
      description: |
        Permission `panen.lihat`. Query: `dari`, `sampai` (`YYYY-MM-DD`), `status_erp` (`BARU`, `DIBACA`, `DIIMPOR`, `DITOLAK`), `cari` (kode blok atau TPH), `halaman` (mulai 1), `per_halaman` (bawaan 25, maksimal 100). Terbaru dulu. Galat: 422 filter salah format.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: dari
          in: query
          required: false
          schema: { type: string }
        - name: sampai
          in: query
          required: false
          schema: { type: string }
        - name: status_erp
          in: query
          required: false
          schema: { type: string }
        - name: cari
          in: query
          required: false
          schema: { type: string }
        - name: halaman
          in: query
          required: false
          schema: { type: integer }
        - name: per_halaman
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HalamanPanen' }
        '400': { $ref: '#/components/responses/TidakValid' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { description: Data tidak ditemukan., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Bentrok (kode ganda atau masih dipakai)., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/TidakValid' }
        '500': { $ref: '#/components/responses/SalahServer' }
  /api/admin/panen/{id}:
    get:
      tags: [Admin]
      summary: Detail catatan panen
      description: |
        Permission `panen.lihat`. Satu catatan lengkap: GPS, grading per kelas (hitungan AI dan akhir), pemanen (nama dicocokkan dari master), daftar foto (`id` dipakai di `GET /api/admin/foto/{id}`), dan log impor ERP. Galat: 404 · 422 id bukan UUID.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Berhasil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanenDetail' }
        '400': { $ref: '#/components/responses/TidakValid' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { description: Data tidak ditemukan., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Bentrok (kode ganda atau masih dipakai)., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/TidakValid' }
        '500': { $ref: '#/components/responses/SalahServer' }
  /api/admin/foto/{id}:
    get:
      tags: [Admin]
      summary: Unduh foto catatan
      description: |
        Permission `panen.lihat`. Mengembalikan byte JPEG (`Content-Type: image/jpeg`) dengan token di header `Authorization`. Karena itu browser memuatnya dengan `fetch` lalu membuat blob, bukan tag gambar biasa. Hanya foto catatan di unit pengguna. Galat: 404 foto atau berkasnya tidak ada · 422 id bukan UUID.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Byte JPEG.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/TidakValid' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { description: Data tidak ditemukan., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Bentrok (kode ganda atau masih dipakai)., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/TidakValid' }
        '500': { $ref: '#/components/responses/SalahServer' }
