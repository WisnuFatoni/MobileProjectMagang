        - { name: sampai, in: query, required: false, description: "YYYY-MM-DD", schema: { type: string } }
        - { name: status, in: query, required: false, description: "MENUNGGU, DISETUJUI, atau DITOLAK", schema: { type: string } }
        - { name: divisi_kode, in: query, required: false, description: "Kode divisi", schema: { type: string } }
        - { name: blok_kode, in: query, required: false, description: "Kode blok", schema: { type: string } }
        - { name: pemanen_hrmb_code, in: query, required: false, description: "HRMBCODE pemanen", schema: { type: integer } }
        - { name: halaman, in: query, required: false, description: "Mulai 1", schema: { type: integer } }
        - { name: per_halaman, in: query, required: false, description: "Bawaan 25, maksimal 100", schema: { type: integer } }
      responses:
        '200':
