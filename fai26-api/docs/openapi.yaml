            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { description: Tidak ditemukan., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Bentrok (sudah diproses, atau nomor ganda)., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/TidakValid' }
        '500': { $ref: '#/components/responses/SalahServer' }
  /api/ipd/{id}/media:
    post:
      tags: [IPD]
      summary: Unggah satu foto bukti inspeksi
      description: |
        Permission `ipd.kirim`. Body mentah JPEG (maksimal 8 MB), header `X-Foto-Id` (UUID) dan `X-Sha256` (64 hex), query `keterangan` (maksimal 200 karakter) dan `urut` (0 sampai 9999). Tanpa batas jumlah foto per inspeksi. Idempoten menurut `X-Foto-Id`. HP boleh menghapus berkas fotonya setelah jawaban 200 atau 201.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: keterangan, in: query, required: false, description: "Keterangan foto", schema: { type: string } }
        - { name: urut, in: query, required: false, description: "Urutan foto", schema: { type: integer } }
      responses:
        '201':
          description: Foto baru diterima.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanenDiterima' }
        '200':
          description: Foto ini sudah pernah diterima.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanenDiterima' }
        '401': { $ref: '#/components/responses/TidakLogin' }
        '400': { $ref: '#/components/responses/TidakValid' }
        '403': { $ref: '#/components/responses/Terlarang' }
        '404': { description: Tidak ditemukan., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: Foto melebihi 8 MB., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Bukan JPEG., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/TidakValid' }
        '500': { $ref: '#/components/responses/SalahServer' }
  /api/ipd/foto/{id}:
    get:
      tags: [IPD]
      summary: Unduh foto bukti inspeksi
      description: |
        Permission `ipd.lihat`. Mengembalikan byte JPEG (`Content-Type: image/jpeg`) foto bukti inspeksi di unit pengguna.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Byte JPEG.
          content:
